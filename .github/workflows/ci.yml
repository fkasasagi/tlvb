name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (vet / build / test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go vet
        run: go vet ./...
      - name: build
        run: go build -o bin/tlvb ./cmd/tlvb
      - name: go test
        run: go test ./...

  python:
    name: Python (ruff / pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: install deps
        run: pip install -e ".[dev]"
      - name: ruff
        run: ruff check parsers/
      - name: pytest
        env:
          PYTHONPATH: .
        run: pytest tests/

  ui:
    name: UI (i18n t() shadow guard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pin Node so the script's `node --check` syntax gate is guaranteed,
      # rather than relying on the runner image happening to ship Node.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: i18n shadow guard
        run: bash scripts/check-i18n-shadow.sh
