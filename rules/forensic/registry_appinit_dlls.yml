id: forensic-registry-appinit-dlls
title: "AppInit_DLLs Injection Persistence (Registry)"
level: high
artifacts: [registry]
mitre:
  tactics: [persistence, privilege-escalation, defense-evasion]
  techniques: [T1546.010]
description: >
  Re-expresses Sigma 'registry_set' (Sysmon EventID 13) AppInit_DLLs detection
  against the registry artifact (RECmd decodes the SOFTWARE hive Windows key) —
  no Sysmon needed. A non-empty AppInit_DLLs value (with LoadAppInit_DLLs
  enabled) forces every user-mode process that loads user32.dll to load the
  attacker DLL.
detection: >
  Match registry rows where ValueName ILIKE 'AppInit_DLLs' AND ValueData is
  non-empty/non-blank (a DLL path) — OR ValueName ILIKE 'LoadAppInit_DLLs' with
  ValueData = '1'/'0x1'. Treat a populated AppInit_DLLs as the signal; surface
  KeyPath, ValueName, ValueData.
references:
  - https://attack.mitre.org/techniques/T1546/010/
