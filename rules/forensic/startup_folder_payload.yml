id: forensic-startup-folder-payload
title: "Payload Dropped in a Startup Folder (MFT)"
level: high
artifacts: [mft]
mitre:
  tactics: [persistence]
  techniques: [T1547.001]
description: >
  Re-expresses Sigma 'file_event' (Sysmon EventID 11) Startup-folder persistence
  WITHOUT Sysmon. Sysmon would record the creating process, which $MFT cannot;
  but the persistence artifact itself — an executable/script/shortcut sitting in
  a Startup folder — is fully visible in $MFT and is what actually re-runs at
  logon.
detection: >
  Match mft rows where FullPath is inside a Startup folder —
  ILIKE '%\Start Menu\Programs\Startup\%' (per-user) OR
  '%\ProgramData\Microsoft\Windows\Start Menu\Programs\StartUp\%' (all-users) —
  AND the file is executable/scripting/shortcut content: ends in .lnk, .exe,
  .bat, .cmd, .vbs, .vbe, .js, .jse, .ps1, .hta, .scr, .wsf, .pif. Exclude
  desktop.ini. Surface FullPath.
references:
  - https://attack.mitre.org/techniques/T1547/001/
