id: forensic-registry-ifeo-debugger
title: "Image File Execution Options Debugger / Accessibility Hijack (Registry)"
level: high
artifacts: [registry]
mitre:
  tactics: [persistence, privilege-escalation, defense-evasion]
  techniques: [T1546.012, T1546.008]
description: >
  Re-expresses Sigma 'registry_set' (Sysmon EventID 13) IFEO-debugger and
  accessibility-feature hijack detections against the registry artifact (RECmd
  decodes the SOFTWARE hive) — no Sysmon needed. Setting a Debugger value under
  Image File Execution Options, or repointing an accessibility binary
  (sethc.exe, utilman.exe, osk.exe, magnify.exe, narrator.exe, displayswitch.exe)
  to cmd/powershell, gives pre-logon SYSTEM execution.
detection: >
  Match registry rows where KeyPath ILIKE '%\Image File Execution Options\%'
  AND ValueName ILIKE 'Debugger' AND ValueData is non-empty — OR KeyPath
  references one of the accessibility binaries above with a Debugger value
  pointing at cmd.exe/powershell.exe/a user-writable path. Surface KeyPath,
  ValueName, ValueData.
references:
  - https://attack.mitre.org/techniques/T1546/012/
  - https://attack.mitre.org/techniques/T1546/008/
