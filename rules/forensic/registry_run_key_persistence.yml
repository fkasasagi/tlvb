id: forensic-registry-run-key-persistence
title: "Autorun (Run/RunOnce) Persistence Pointing at a Suspicious Payload"
level: high
artifacts: [registry]
mitre:
  tactics: [persistence]
  techniques: [T1547.001]
description: >
  Re-expresses Sigma logsource.category 'registry_set' (Sysmon EventID 13) for
  Run-key persistence WITHOUT Sysmon: Sysmon is rarely deployed, but RECmd
  decodes the very same autorun keys from the registry hives. A Run/RunOnce
  value whose data points at a user-writable staging folder or invokes a
  scripting/LOLBin host is classic auto-start persistence.
detection: >
  Match registry rows where KeyPath references an autorun location —
  ILIKE '%\CurrentVersion\Run%' OR '%\CurrentVersion\RunOnce%' OR
  '%\CurrentVersion\Explorer\Run%' (covers HKLM and HKCU; Description='Run'
  also marks these) — AND ValueData (the command/path) looks malicious:
  it sits under \Users\...\Downloads\ / \Desktop\ / \AppData\ / \ProgramData\ /
  \Windows\Temp\, OR invokes powershell/cmd/wscript/cscript/mshta/rundll32/
  regsvr32 with download/encoded markers (-enc, -e jab, frombase64string,
  downloadstring, http://, https://, javascript:). Surface KeyPath, ValueName,
  ValueData, HiveType.
references:
  - https://attack.mitre.org/techniques/T1547/001/
