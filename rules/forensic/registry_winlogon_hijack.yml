id: forensic-registry-winlogon-hijack
title: "Winlogon Shell/Userinit Persistence Hijack (Registry)"
level: high
artifacts: [registry]
mitre:
  tactics: [persistence, privilege-escalation]
  techniques: [T1547.004]
description: >
  Re-expresses Sigma 'registry_set' (Sysmon EventID 13) Winlogon-hijack against
  the registry artifact (RECmd decodes the SOFTWARE hive Winlogon key) — no
  Sysmon needed. Appending a payload to the Winlogon Shell or Userinit value
  runs it at every interactive logon.
detection: >
  Match registry rows where KeyPath ILIKE '%\Windows NT\CurrentVersion\Winlogon%'
  AND ValueName IN ('Shell','Userinit') AND ValueData deviates from the defaults
  — i.e. Shell is not exactly 'explorer.exe' and Userinit is not exactly
  'C:\Windows\system32\userinit.exe,' — especially when ValueData contains an
  extra comma-appended binary, a user-writable path (\Users\, \AppData\,
  \ProgramData\, \Temp\), or a scripting host (cmd/powershell/wscript). Surface
  KeyPath, ValueName, ValueData.
references:
  - https://attack.mitre.org/techniques/T1547/004/
