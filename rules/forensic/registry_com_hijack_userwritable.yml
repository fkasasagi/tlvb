id: forensic-registry-com-hijack-userwritable
title: "COM Hijack — InprocServer32 Repointed to a User-Writable DLL (Registry)"
level: medium
artifacts: [registry]
mitre:
  tactics: [persistence, privilege-escalation, defense-evasion]
  techniques: [T1546.015]
description: >
  Re-expresses Sigma 'registry_event' (Sysmon EventID 12/13) COM-hijack
  detection against the registry artifact (RECmd decodes the NTUSER hive) — no
  Sysmon needed. A per-user CLSID InprocServer32 entry that shadows a
  machine-wide COM object and points at a DLL in a user-writable path hijacks
  that object's load.
detection: >
  Match registry rows where KeyPath ILIKE '%\CLSID\%\InprocServer32%' (or
  '%\CLSID\%\LocalServer32%') AND HiveType ILIKE 'NTUSER' (per-user hijack of a
  normally machine-wide object) AND ValueData (the DLL/exe path) sits under a
  user-writable location — \Users\ / \AppData\ / \ProgramData\ / \Temp\ /
  \Downloads\. Surface KeyPath, ValueName, ValueData, HiveType.
references:
  - https://attack.mitre.org/techniques/T1546/015/
