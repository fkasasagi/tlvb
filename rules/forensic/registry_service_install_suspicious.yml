id: forensic-registry-service-install-suspicious
title: "Service Installed With a Suspicious ImagePath (Registry)"
level: high
artifacts: [registry]
mitre:
  tactics: [persistence, privilege-escalation]
  techniques: [T1543.003]
description: >
  Re-expresses Sigma logsource.category 'registry_set' (Sysmon EventID 13) and
  the Security 7045 service-install idea against the registry artifact, which
  RECmd decodes from the SYSTEM hive's \Services\ subkeys — no Sysmon required.
  A new/modified service whose ImagePath runs from a user-writable location or
  via a scripting/LOLBin host is a common persistence + SYSTEM-level execution
  primitive.
detection: >
  Match registry rows under a Services key — KeyPath ILIKE
  '%\Services\%' (Description='Services' also marks these) — where the
  ImagePath/command value is suspicious: ValueName ILIKE 'ImagePath' (or
  ValueData is the binary path) AND ValueData sits under \Users\ / \ProgramData\
  / \AppData\ / \Windows\Temp\ / \PerfLogs\, OR invokes powershell/cmd/rundll32/
  regsvr32/mshta, OR uses '%COMSPEC%' / '-enc' / 'DownloadString'. Surface
  KeyPath, ValueName, ValueData.
references:
  - https://attack.mitre.org/techniques/T1543/003/
