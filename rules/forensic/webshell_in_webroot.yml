id: forensic-webshell-in-webroot
title: "Server-Side Script Written Into a Web Root (MFT) — Web Shell"
level: high
artifacts: [mft]
mitre:
  tactics: [persistence]
  techniques: [T1505.003]
description: >
  Re-expresses Sigma 'file_event' (Sysmon EventID 11) web-shell-drop detection
  WITHOUT Sysmon. A server-side script file physically present under a web root
  is a concrete on-disk artifact in $MFT (independent of any access log or
  Sysmon), and corroborates a web shell where the access log alone is
  ambiguous.
detection: >
  Match mft rows where FullPath is under a web-content root —
  ILIKE '%\inetpub\wwwroot\%' OR '%\wwwroot\%' OR '%\htdocs\%' OR '%\www\%' OR
  '%\tomcat%\webapps\%' OR '%\xampp\htdocs\%' — AND ends in a server-side script
  extension: .aspx, .asp, .ashx, .asmx, .asax, .php, .php3, .php4, .php5, .phtml,
  .jsp, .jspx, .jspf, .cfm. Surface FullPath. (Tier 2 corroborates this against
  web-server access logs / IIS presence.)
references:
  - https://attack.mitre.org/techniques/T1505/003/
