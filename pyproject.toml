# FindEvil parsers — Python project metadata.
#
# The Go binary invokes `python3 -m parsers.orchestrator` as a subprocess.
# This file documents the runtime + dev dependencies for that subprocess.

[project]
name = "findevil-parsers"
version = "0.1.0"
description = "FindEvil Tier 0 — DFIR artifact parsers wrapping SIFT tools"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"

dependencies = [
    # DuckDB Python client — used by parsers/orchestrator.py to write
    # parse_results / unified_events into the case DB.
    "duckdb>=1.5,<2.0",
    # 7z extraction for nested archive support (REQ-1).
    # zip / tar / tar.gz / tar.bz2 / tar.xz / gz are handled by stdlib;
    # py7zr adds LZMA2-based .7z. Optional in practice: if the import
    # fails the orchestrator records skip:missing_backend and continues.
    "py7zr>=0.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["parsers"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # line-length handled by formatter

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --tb=short"
