<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>TLVB — DFIR Examiner</title>
  <meta name="viewport" content="width=1280">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="logo">TL</span>
      <span class="title">TLVB</span>
      <span class="subtitle">DFIR Examiner Portal</span>
    </div>
    <nav class="crumbs" id="crumbs"></nav>
    <div class="meta" id="topMeta"></div>
    <!-- Wave 32: language switcher (locale persists in localStorage) -->
    <!-- Display timezone switcher. Events are stored UTC; this only changes
         how timestamps render. "Per-evidence (configured)" uses the timezone
         the examiner configured on each evidence (not auto-detected); any
         other value forces that zone across the whole view.
         Options are populated by app.js (IANA list); persists in localStorage. -->
    <select id="tz-switcher"
            title="Display timezone (events are stored in UTC)"
            style="margin-left: auto; padding: 2px 6px; font-size: 11px;
                   background: #15192a; color: #ccc; border: 1px solid #2a2e44;"></select>
    <!-- Wave 32: language switcher (locale persists in localStorage) -->
    <select id="lang-switcher"
            title="UI language"
            style="margin-left: 6px; padding: 2px 6px; font-size: 11px;
                   background: #15192a; color: #ccc; border: 1px solid #2a2e44;">
      <option value="ja">日本語</option>
      <option value="en">English</option>
    </select>
  </header>
  <main id="app"></main>
  <div id="modal" class="modal-shade hidden"></div>
  <div id="toast" class="toast hidden"></div>
  <script src="/static/app.js"></script>
</body>
</html>
